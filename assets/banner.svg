<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Dynamic Animation Elements */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes barRise {
      0% { height: 10px; y: 300px; }
      50% { height: 60px; y: 250px; }
      100% { height: 10px; y: 300px; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }

    .pulsing-orb-1 {
      animation: pulseGlow 7s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .pulsing-orb-2 {
      animation: pulseGlow 9s ease-in-out infinite reverse;
      transform-origin: 1000px 240px;
    }
    .flow-path {
      stroke-dasharray: 12, 12;
      animation: flowLine 14s linear infinite;
    }
    .float-badge-1 {
      animation: floatPill 5s ease-in-out infinite;
    }
    .float-badge-2 {
      animation: floatPill 6s ease-in-out infinite 1.5s;
    }
    .float-badge-3 {
      animation: floatPill 5.5s ease-in-out infinite 0.8s;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGlow)" />

  <!-- Ambient Animated Light Orbs in Background -->
  <circle cx="220" cy="110" r="140" fill="#4338ca" filter="url(#glow)" class="pulsing-orb-1" />
  <circle cx="980" cy="220" r="160" fill="#0369a1" filter="url(#glow)" class="pulsing-orb-2" />
  <circle cx="620" cy="180" r="90" fill="#701a75" filter="url(#glow)" opacity="0.25" />

  <!-- Geometric Grid & Flow Curves (Lower Z-Index) -->
  <g opacity="0.18">
    <path d="M 0 60 H 1200 M 0 120 H 1200 M 0 180 H 1200 M 0 240 H 1200 M 0 300 H 1200" stroke="#94a3b8" stroke-width="0.7" />
    <path d="M 150 0 V 360 M 300 0 V 360 M 450 0 V 360 M 600 0 V 360 M 750 0 V 360 M 900 0 V 360 M 1050 0 V 360" stroke="#94a3b8" stroke-width="0.7" />
  </g>

  <!-- Dynamic Revenue Trend / Waterfall Curve in Background -->
  <path d="M 50 310 Q 300 320 450 250 T 800 170 T 1150 90" fill="none" stroke="url(#primaryGrad)" stroke-width="3" opacity="0.5" class="flow-path" />

  <!-- Animated Revenue Bars (Bottom Right Decorative) -->
  <g opacity="0.35">
    <rect x="920" y="270" width="16" height="50" rx="3" fill="#38bdf8" />
    <rect x="950" y="240" width="16" height="80" rx="3" fill="#6366f1" />
    <rect x="980" y="210" width="16" height="110" rx="3" fill="#818cf8" />
    <rect x="1010" y="180" width="16" height="140" rx="3" fill="#a855f7" />
    <rect x="1040" y="150" width="16" height="170" rx="3" fill="#c084fc" />
    <rect x="1070" y="120" width="16" height="200" rx="3" fill="#38bdf8" />
  </g>

  <!-- FOREGROUND CONTENT: Header & Badges -->
  <g id="foreground-content">
    <!-- Top Pill Tag -->
    <g class="float-badge-1" transform="translate(60, 48)">
      <rect width="320" height="32" rx="16" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <circle cx="16" cy="16" r="5" fill="#10b981" />
      <text x="30" y="21" font-size="12" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">FINTECH &amp; REVOPS DIRECTORY ⚡</text>
    </g>

    <!-- Main Title -->
    <text x="60" y="132" font-size="44" font-weight="800" fill="url(#primaryGrad)" letter-spacing="-1">
      Awesome Revenue Recognition
    </text>
    <text x="60" y="180" font-size="34" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">
      &amp; Revenue Operations (RevOps) 📈
    </text>

    <!-- Subtitle / Meta Description -->
    <text x="60" y="222" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated directory of SaaS subledgers, open-source compliance engines, ASC 606 / IFRS 15 frameworks,
    </text>
    <text x="60" y="246" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      and autonomous GTM &amp; pipeline operations tools for finance, billing, and accounting teams.
    </text>

    <!-- Floating Foreground Interactive Feature Pills -->
    <g class="float-badge-2" transform="translate(60, 282)">
      <!-- Pill 1: ASC 606 -->
      <g transform="translate(0, 0)">
        <rect width="170" height="36" rx="8" fill="rgba(14, 165, 233, 0.12)" stroke="rgba(14, 165, 233, 0.4)" stroke-width="1" />
        <text x="14" y="23" font-size="13" font-weight="600" fill="#38bdf8">⚖️ ASC 606 / IFRS 15</text>
      </g>
      <!-- Pill 2: Revenue Subledger -->
      <g transform="translate(182, 0)">
        <rect width="190" height="36" rx="8" fill="rgba(99, 102, 241, 0.12)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1" />
        <text x="14" y="23" font-size="13" font-weight="600" fill="#818cf8">📑 Revenue Subledgers</text>
      </g>
      <!-- Pill 3: RevOps & AI Agents -->
      <g transform="translate(384, 0)">
        <rect width="195" height="36" rx="8" fill="rgba(168, 85, 247, 0.12)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1" />
        <text x="14" y="23" font-size="13" font-weight="600" fill="#c084fc">🤖 RevOps &amp; AI Agents</text>
      </g>
      <!-- Pill 4: Open Source -->
      <g transform="translate(591, 0)">
        <rect width="175" height="36" rx="8" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
        <text x="14" y="23" font-size="13" font-weight="600" fill="#34d399">💻 Open-Source Tools</text>
      </g>
    </g>
  </g>
</svg>